{% extends 'base.html' %}
{% load crispy_forms_filters %}

{% block title %}Create Task{% endblock %}

{% block content %}
<div class="card shadow-sm p-4">
    <h1 class="mb-4 text-center">📝 {{ object|yesno:"Update,Create" }} a New Task</h1>

    <form method="post">
        {% csrf_token %}

        <div class="mb-4">
            {{ form.as_p }}
        </div>

        <div class="d-flex justify-content-between mt-4">
            <a href="{% url 'website:home' %}" class="btn btn-outline-secondary">← Back to Task List</a>
            <button type="submit" class="btn btn-primary">{{ object|yesno:"Update,Create" }} Task</button>
        </div>
    </form>
</div>
{% endblock %}
