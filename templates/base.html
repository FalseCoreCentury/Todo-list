<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Todo App{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .sidebar {
            height: 100vh;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            padding-top: 2rem;
        }
        .sidebar h5 {
            font-weight: bold;
            margin-bottom: 1.5rem;
        }
        .sidebar .nav-link {
            font-size: 1.1rem;
            padding: 0.75rem 1rem;
        }
        .sidebar .nav-link:hover {
            background-color: #e9ecef;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row min-vh-100">
        <!-- Sidebar -->
        <nav class="col-md-2 bg-white sidebar d-flex flex-column align-items-center">
            <h5 class="text-center">📋 Menu</h5>
            <ul class="nav flex-column w-100 px-2">
                <li class="nav-item">
                    <a class="nav-link text-dark" href="{% url 'website:home' %}">🏠 Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-dark" href="{% url 'website:tags' %}">🏷️ Tags</a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="col-md-10 px-4 py-4">
            {% block content %}
            {% endblock %}
        </main>
    </div>
</div>

</body>
</html>
